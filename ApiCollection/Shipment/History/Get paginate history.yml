info:
  name: Get paginate history
  type: http
  seq: 1

http:
  method: GET
  url: "{{ADB_baseURL}}/api/v1/shipment/history?page=1&limit=20&filter=ORDERED_DESC&year=2026"
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "20"
      type: query
    - name: filter
      value: ORDERED_DESC
      type: query
    - name: year
      value: "2026"
      type: query
  auth:
    type: bearer
    token: "{{ADB_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
