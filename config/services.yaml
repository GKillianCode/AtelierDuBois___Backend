# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            bool $debug: "%kernel.debug%"

    _instanceof:
        App\Interface\CarrierInterface:
            tags: [app.carrier_handler]

    App\:
        resource: "../src/"

    App\Factory\CarrierFactory:
        arguments:
            $handle: !tagged_iterator app.carrier_handler

    App\Serializer\Normalizer\Product\ResponseResumeProductDtoNormalizer:
        tags:
            - { name: "serializer.normalizer", priority: 100 }

    App\Serializer\Normalizer\Product\ResponseResumeProductVariantDtoNormalizer:
        tags:
            - { name: "serializer.normalizer", priority: 100 }

    App\Serializer\Normalizer\Product\ResponseProductDtoNormalizer:
        tags:
            - { name: "serializer.normalizer", priority: 100 }

    App\Serializer\Normalizer\Product\CategoryDtoNormalizer:
        tags:
            - { name: "serializer.normalizer", priority: 100 }

    App\Serializer\Normalizer\User\AddressDtoNormalizer:
        tags:
            - { name: "serializer.normalizer", priority: 100 }

    App\Serializer\Normalizer\Shipment\ResponseShipmentItemDtoNormalizer:
        tags:
            - { name: "serializer.normalizer", priority: 100 }

    #App\Serializer\Normalizer\Shipment\ResponseShipmentsPreviewArrayNormalizer:
    #    tags:
    #        - { name: "serializer.normalizer", priority: 100 }

    App\Serializer\Normalizer\Shipment\ResponseShipmentsPreviewDtoNormalizer:
        tags:
            - { name: "serializer.normalizer", priority: 100 }
    App\Serializer\Normalizer\Shipment\ResponseShipmentsHistoryDtoNormalizer:
        tags:
            - { name: "serializer.normalizer", priority: 100 }
